# Intégration continue et déploiement continu (CI/CD) pour le bot WhatsApp de l’Imposteur à chaque push sur la branche principale (master) ou à chaque tag v*.
name: deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rendu réel des images (sharp + polices)
        run: npm run smoke
      - name: Audit des dépendances (information, non bloquant)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: imposteur-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rendu des images dans l'image Docker
        run: docker run --rm -e DATA_DIR=/tmp/d imposteur-bot:ci node scripts/smoke.js
      - name: Se connecter à GHCR (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag imposteur-bot:ci "$REPO:${GITHUB_REF_NAME}"
          docker tag imposteur-bot:ci "$REPO:latest"
          docker push "$REPO:${GITHUB_REF_NAME}"
          docker push "$REPO:latest"

  deploy:
    name: Mise à jour du serveur
    needs: [tests, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_DIR
          script_stop: true
          script: |
            cd "${DEPLOY_DIR:-$HOME/imposteurBot}"
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build
            echo "Attente de la sonde de santé (jusqu'à 3 min)…"
            for i in $(seq 1 18); do
              state=$(docker inspect --format '{{.State.Status}}' imposteur 2>/dev/null || echo "missing")
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' imposteur 2>/dev/null || echo "unknown")
              echo "  état conteneur : $state | santé : $health"
              if [ "$health" = "healthy" ] || { [ "$health" = "none" ] && [ "$state" = "running" ]; }; then
                exit 0
              fi
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                docker compose logs --tail 40
                exit 1
              fi
              sleep 10
            done
            docker compose logs --tail 40
            exit 1