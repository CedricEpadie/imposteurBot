# Intégration continue : à chaque push / pull request, on vérifie que le bot fonctionne.
name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rendu réel des images (sharp + polices)
        run: npm run smoke
      - name: Audit des dépendances (information, non bloquant)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: imposteur-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rendu des images dans l'image Docker
        run: docker run --rm -e DATA_DIR=/tmp/d imposteur-bot:ci node scripts/smoke.js
      - name: Se connecter à GHCR (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier l'image (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker tag imposteur-bot:ci "$REPO:${GITHUB_REF_NAME}"
          docker tag imposteur-bot:ci "$REPO:latest"
          docker push "$REPO:${GITHUB_REF_NAME}"
          docker push "$REPO:latest"
